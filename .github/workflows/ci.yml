# Build and test on every push.
#
# No game files are needed or used: the Python suite runs against synthetic
# instructions and synthetic XBEs, the C build produces the runtime libraries,
# and ctest runs small offline tests over them. Nothing here links a
# recompiled title.
#
# Why it exists: the v0.9.0 upstream merge broke the MSVC build twice (a
# dropped closing brace, and two bodies for one bridge function) and nothing
# noticed, because no job compiled the C. The Linux and macOS jobs are what
# prove the runtime stays free of Windows and Direct3D headers.
#
# An implicit function declaration is an error on every job: the root
# CMakeLists says so, and the POSIX jobs pass it again in CFLAGS so that a
# CMake edit cannot quietly turn it back into a warning. Three Win32 calls
# with no POSIX shim (SetWaitableTimer and friends) once landed because the
# POSIX build only warned about them.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest capstone

      # tools/fusion needs pefile and MS Fusion inputs; it is optional tooling.
      - name: Run tests
        run: python -m pytest -q --ignore=tools/fusion

  linux:
    name: Build and test (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from its submodule; the others are not needed here.
      - name: Fetch SDL3
        run: git submodule update --init --depth 1 third_party/SDL

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libssl-dev

      - name: Configure
        env:
          CFLAGS: -Werror=implicit-function-declaration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: Build and test (macOS, Apple Silicon, clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # SDL3 for the host layer, and the Vulkan renderer's headers. The
      # renderer finds the Vulkan loader and DXC at run time, so none of
      # these is a link dependency.
      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 \
            third_party/SDL third_party/Vulkan-Headers \
            third_party/volk third_party/VulkanMemoryAllocator

      # DXC's headers (dxcapi.h and the WinAdapter.h it needs off Windows),
      # without the rest of the repository. If this fails the renderer is
      # built without its Vulkan backend, which still compiles and links.
      - name: Fetch DXC headers
        continue-on-error: true
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/microsoft/DirectXShaderCompiler.git "$RUNNER_TEMP/dxc"
          git -C "$RUNNER_TEMP/dxc" sparse-checkout set include/dxc
          mkdir -p third_party/dxc/inc
          cp "$RUNNER_TEMP"/dxc/include/dxc/*.h third_party/dxc/inc/

      - name: Install build dependencies
        run: brew install ninja openssl@3

      - name: Configure
        env:
          CFLAGS: -Werror=implicit-function-declaration
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel

      # No game data here, so no title is linked; the unit tests run muted
      # (tests/audio_output forces RECOMP_MUTE and skips with no device),
      # and the replay test skips without a Vulkan device. Nothing opens a
      # window: tests/host_window is not a ctest.
      - name: Test
        env:
          RECOMP_MUTE: "1"
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Build and test (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL3
        run: git submodule update --init --depth 1 third_party/SDL

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
